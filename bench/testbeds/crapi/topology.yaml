- name: crapi-community
  lang: go/gorilla
  port: 8087
  endpoints:
  - method: GET
    path: /community/api/v2/community/posts/recent
    auth: required
    source: api/router/routes.go
    calls:
    - &id001
      service: crapi-identity
      method: POST
      path: /identity/api/auth/verify
    documented: true
  - method: GET
    path: /community/api/v2/community/posts/search
    auth: required
    source: api/router/routes.go
    calls:
    - *id001
    documented: false
  - method: GET
    path: /community/api/v2/community/posts/{postID}
    auth: required
