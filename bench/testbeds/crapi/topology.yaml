name: crapi
description: API surface of OWASP crAPI, mined from source; documentation = crAPI's published OpenAPI spec
source:
  repo: https://github.com/OWASP/crAPI
  commit: b5fc307f3e5f875809b095b771108ef342a33724
documentation: spec-file
spec_file: openapi/crapi-openapi-spec.json
id_style: int
gateway:
  service: crapi-web
  kind: nginx
  config: gateway/nginx.conf.template
  uninstrumented: true
  routes:
  - path: /identity/
    service: crapi-identity
  - path: /community/
    service: crapi-community
  - path: /workshop/
    service: crapi-workshop
  - path: /chatbot/
    service: crapi-chatbot
spec_only_operations: []
services:
