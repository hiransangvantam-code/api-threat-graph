# ATG Phase 1 configuration for CareLink (read by docker/scan.py from /target/atg-target.yaml).
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
# Paths are relative to this folder, which ATG mounts read-only at /target.
target:
  name: CareLink
  service_map:
    web-gateway:8080: web-gateway
    auth-service:8000: auth-service
    patient-service:8000: patient-service
    appointment-service:8000: appointment-service
    records-service:8000: records-service
    reporting-service:8000: reporting-service
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: web-gateway
      base_url: http://web-gateway:8080
    - service: auth-service
      base_url: http://auth-service:8000
    - service: patient-service
      base_url: http://patient-service:8000
    - service: appointment-service
      base_url: http://appointment-service:8000
    - service: records-service
      base_url: http://records-service:8000
    - service: reporting-service
      base_url: http://reporting-service:8000
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths: []
    gateway_configs:
    - path: gateway/nginx.conf
      type: nginx
      service: web-gateway
      env_from:
      - k8s/gateway.yaml
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
