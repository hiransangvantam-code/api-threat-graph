# CareLink: nginx API gateway (web-gateway).
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
# Rendered by the nginx image's envsubst step from /etc/nginx/templates; ${..._URL} come from the
# web-gateway-env ConfigMap.

events {}

http {
    limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;
    server {
        listen 8080;
        server_name portal.carelink.example;

        location = /_auth {
            internal;
            proxy_pass http://auth-service:8000/auth/introspect;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location /api/appointments {
            auth_request /_auth;
            proxy_pass http://appointment-service:8000/appointments;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        location /api/auth {
            limit_req zone=login burst=5 nodelay;
            proxy_pass http://auth-service:8000/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        location /api/patients {
            auth_request /_auth;
            proxy_pass http://patient-service:8000/patients;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        location /api/records {
            auth_request /_auth;
            proxy_pass http://records-service:8000/records;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        location / {
            return 404;
        }
    }
}
