# CareLink: API gateway (nginx)
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: web-gateway
  namespace: carelink
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-gateway
  namespace: carelink
  labels:
    app: web-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-gateway
  template:
    metadata:
      labels:
        app: web-gateway
    spec:
      serviceAccountName: web-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web-gateway
        image: nginxinc/nginx-unprivileged:1.27.2-alpine
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: '8080'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/templates
        envFrom:
        - configMapRef:
            name: web-gateway-env
      volumes:
      - name: nginx-conf
        configMap:
          name: web-gateway-conf
---
apiVersion: v1
kind: Service
metadata:
  name: web-gateway
  namespace: carelink
spec:
  type: ClusterIP
  selector:
    app: web-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-gateway-ingress
  namespace: carelink
spec:
  podSelector:
    matchLabels:
      app: web-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - port: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-gateway-env
  namespace: carelink
data:
  AUTH_SERVICE_URL: http://auth-service:8000
  PATIENT_SERVICE_URL: http://patient-service:8000
  APPOINTMENT_SERVICE_URL: http://appointment-service:8000
  RECORDS_SERVICE_URL: http://records-service:8000
  REPORTING_SERVICE_URL: http://reporting-service:8000
