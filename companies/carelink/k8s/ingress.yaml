# CareLink: public entry point
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: carelink-api
  namespace: carelink
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  rules:
  - host: portal.carelink.example
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: web-gateway
            port:
              number: 8080
  tls:
  - hosts:
    - portal.carelink.example
    secretName: carelink-api-tls
