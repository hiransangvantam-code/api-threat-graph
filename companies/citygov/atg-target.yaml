# ATG Phase 1 configuration for CityGov (read by docker/scan.py from /target/atg-target.yaml).
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
# Paths are relative to this folder, which ATG mounts read-only at /target.
target:
  name: CityGov
  service_map:
    gov-gateway:8080: gov-gateway
    auth-service:8080: auth-service
    citizen-service:8080: citizen-service
    permit-service:8080: permit-service
    tax-service:8080: tax-service
    admin-service:8080: admin-service
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: gov-gateway
      base_url: http://gov-gateway:8080
    - service: auth-service
      base_url: http://auth-service:8080
    - service: citizen-service
      base_url: http://citizen-service:8080
    - service: permit-service
      base_url: http://permit-service:8080
    - service: tax-service
      base_url: http://tax-service:8080
    - service: admin-service
      base_url: http://admin-service:8080
    spec_files:
    - path: specs/permit-service.yaml
      service: permit-service
  infrastructure:
    enabled: true
    manifest_paths: []
    gateway_configs:
    - path: gateway/nginx.conf
      type: nginx
      service: gov-gateway
      env_from:
      - k8s/gateway.yaml
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
