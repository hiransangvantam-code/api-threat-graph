# CityGov (Government (city e-services)): the company's Docker for the ATG flexibility test.
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
#
# Services in go; gateway gov-gateway plays nginx; outside APIs: none.
# Network citygov-net. The ATG platform joins it; the two settings marked for the review are
# MESH_PROXY (east-west calls through ATG's sidecar) and OTEL_EXPORTER_OTLP_ENDPOINT (spans to ATG).
#
#   docker compose -f companies/citygov/docker-compose.yml up -d --build --wait
#   docker compose -f companies/citygov/docker-compose.yml run --rm users
name: citygov
services:
  gov-gateway:
    build: ../runtime/go
    image: atg-company-go:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: gov-gateway
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - citygov-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /app/service
      - -health
      interval: 2s
      timeout: 3s
      retries: 40
  auth-service:
    build: ../runtime/go
    image: atg-company-go:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: auth-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - citygov-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /app/service
      - -health
      interval: 2s
      timeout: 3s
      retries: 40
  citizen-service:
    build: ../runtime/go
    image: atg-company-go:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: citizen-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - citygov-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /app/service
      - -health
      interval: 2s
      timeout: 3s
      retries: 40
  permit-service:
    build: ../runtime/go
    image: atg-company-go:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: permit-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - citygov-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /app/service
      - -health
      interval: 2s
      timeout: 3s
      retries: 40
  tax-service:
    build: ../runtime/go
    image: atg-company-go:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: tax-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - citygov-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /app/service
      - -health
      interval: 2s
      timeout: 3s
      retries: 40
  admin-service:
    build: ../runtime/go
    image: atg-company-go:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: admin-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - citygov-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /app/service
      - -health
      interval: 2s
      timeout: 3s
      retries: 40
  users:
    build: ../runtime/python
    image: atg-company-python:1.0
    profiles:
    - users
    restart: 'no'
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - citygov-net
    command: python traffic.py --gateway http://atg-proxy:8080 --mesh-proxy http://atg-proxy:8081 --wait 120 --rounds 20
networks:
  citygov-net:
    name: citygov-net
