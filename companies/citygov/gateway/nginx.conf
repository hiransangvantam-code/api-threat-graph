# CityGov: nginx API gateway (gov-gateway).
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
# Rendered by the nginx image's envsubst step from /etc/nginx/templates; ${..._URL} come from the
# gov-gateway-env ConfigMap.

events {}

http {
    limit_req_zone $binary_remote_addr zone=login:10m rate=60r/m;
    server {
        listen 8080;
        server_name eservices.citygov.example;

        location = /_auth {
            internal;
            proxy_pass ${AUTH_SERVICE_URL}/auth/introspect;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location /api/admin {
            auth_request /_auth;
            proxy_pass ${ADMIN_SERVICE_URL}/admin;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        location /api/auth {
            limit_req zone=login burst=5 nodelay;
            proxy_pass ${AUTH_SERVICE_URL}/auth;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        location /api/citizens {
            auth_request /_auth;
            proxy_pass ${CITIZEN_SERVICE_URL}/citizens;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        location /api/permits {
            auth_request /_auth;
            proxy_pass ${PERMIT_SERVICE_URL}/permits;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        location /api/taxes {
            auth_request /_auth;
            proxy_pass ${TAX_SERVICE_URL}/taxes;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        location /api/v1/citizens {
            auth_request /_auth;
            proxy_pass ${CITIZEN_SERVICE_URL}/v1/citizens;
            proxy_set_header Host $host;
            proxy_set_header X-Request-Id $request_id;
        }

        location / {
            return 404;
        }
    }
}
