# CityGov: API gateway (nginx)
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gov-gateway
  namespace: citygov
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gov-gateway
  namespace: citygov
  labels:
    app: gov-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gov-gateway
  template:
    metadata:
      labels:
        app: gov-gateway
    spec:
      serviceAccountName: gov-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gov-gateway
        image: nginxinc/nginx-unprivileged:1.27.2-alpine
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: '8080'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability:4318
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/templates
        envFrom:
        - configMapRef:
            name: gov-gateway-env
      volumes:
      - name: nginx-conf
        configMap:
          name: gov-gateway-conf
---
apiVersion: v1
kind: Service
metadata:
  name: gov-gateway
  namespace: citygov
spec:
  type: ClusterIP
  selector:
    app: gov-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gov-gateway-ingress
  namespace: citygov
spec:
  podSelector:
    matchLabels:
      app: gov-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - port: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gov-gateway-env
  namespace: citygov
data:
  AUTH_SERVICE_URL: http://auth-service:8080
  CITIZEN_SERVICE_URL: http://citizen-service:8080
  PERMIT_SERVICE_URL: http://permit-service:8080
  TAX_SERVICE_URL: http://tax-service:8080
  ADMIN_SERVICE_URL: http://admin-service:8080
