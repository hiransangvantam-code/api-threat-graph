# CityGov: public entry point
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: citygov-api
  namespace: citygov
spec:
  ingressClassName: nginx
  rules:
  - host: eservices.citygov.example
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: gov-gateway
            port:
              number: 8080
