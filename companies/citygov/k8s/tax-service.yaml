# CityGov: tax-service
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tax-service
  namespace: citygov
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tax-service-db
  namespace: citygov
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: tax-service-db
  data:
  - secretKey: password
    remoteRef:
      key: citygov/tax-service/db
      property: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tax-service
  namespace: citygov
  labels:
    app: tax-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tax-service
  template:
    metadata:
      labels:
        app: tax-service
    spec:
      serviceAccountName: tax-service
      automountServiceAccountToken: false
      containers:
      - name: tax-service
        image: registry.citygov.example/citygov/tax-service:2.3.1
        ports:
        - containerPort: 8080
        env:
        - name: SERVICE_NAME
          value: tax-service
        - name: PORT
          value: '8080'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability:4318
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: tax-service-db
              key: password
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: tax-service
  namespace: citygov
spec:
  type: NodePort
  selector:
    app: tax-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tax-service-ingress
  namespace: citygov
spec:
  podSelector:
    matchLabels:
      app: tax-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gov-gateway
    ports:
    - port: 8080
