# ATG Phase 1 configuration for FleetGo (read by docker/scan.py from /target/atg-target.yaml).
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
# Paths are relative to this folder, which ATG mounts read-only at /target.
target:
  name: FleetGo
  service_map:
    ingress-gateway:8080: ingress-gateway
    auth-service:8080: auth-service
    shipment-service:8080: shipment-service
    pricing-service:8080: pricing-service
    tracking-service:8080: tracking-service
    driver-service:8080: driver-service
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: ingress-gateway
      base_url: http://ingress-gateway:8080
    - service: auth-service
      base_url: http://auth-service:8080
    - service: shipment-service
      base_url: http://shipment-service:8080
    - service: pricing-service
      base_url: http://pricing-service:8080
    - service: tracking-service
      base_url: http://tracking-service:8080
    - service: driver-service
      base_url: http://driver-service:8080
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths: []
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
