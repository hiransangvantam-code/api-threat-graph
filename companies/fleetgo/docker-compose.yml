# FleetGo (Logistics (parcel delivery)): the company's Docker for the ATG flexibility test.
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
#
# Services in go; gateway ingress-gateway plays istio; outside APIs: none.
# Network fleetgo-net. The ATG platform joins it; the two settings marked for the review are
# MESH_PROXY (east-west calls through ATG's sidecar) and OTEL_EXPORTER_OTLP_ENDPOINT (spans to ATG).
#
#   docker compose -f companies/fleetgo/docker-compose.yml up -d --build --wait
#   docker compose -f companies/fleetgo/docker-compose.yml run --rm users
name: fleetgo
services:
  ingress-gateway:
    build: ../runtime/go
    image: atg-company-go:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: ingress-gateway
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - fleetgo-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /app/service
      - -health
      interval: 2s
      timeout: 3s
      retries: 40
  auth-service:
    build: ../runtime/go
    image: atg-company-go:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: auth-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - fleetgo-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /app/service
      - -health
      interval: 2s
      timeout: 3s
      retries: 40
  shipment-service:
    build: ../runtime/go
    image: atg-company-go:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: shipment-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - fleetgo-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /app/service
      - -health
      interval: 2s
      timeout: 3s
      retries: 40
  pricing-service:
    build: ../runtime/go
    image: atg-company-go:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: pricing-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - fleetgo-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /app/service
      - -health
      interval: 2s
      timeout: 3s
      retries: 40
  tracking-service:
    build: ../runtime/go
    image: atg-company-go:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: tracking-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - fleetgo-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /app/service
      - -health
      interval: 2s
      timeout: 3s
      retries: 40
  driver-service:
    build: ../runtime/go
    image: atg-company-go:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: driver-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - fleetgo-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /app/service
      - -health
      interval: 2s
      timeout: 3s
      retries: 40
  users:
    build: ../runtime/python
    image: atg-company-python:1.0
    profiles:
    - users
    restart: 'no'
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - fleetgo-net
    command: python traffic.py --gateway http://atg-proxy:8080 --mesh-proxy http://atg-proxy:8081 --wait 120 --rounds 20
networks:
  fleetgo-net:
    name: fleetgo-net
