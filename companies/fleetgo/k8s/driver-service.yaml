# FleetGo: driver-service
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: driver-service
  namespace: fleetgo
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: driver-service-db
  namespace: fleetgo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: driver-service-db
  data:
  - secretKey: password
    remoteRef:
      key: fleetgo/driver-service/db
      property: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-service
  namespace: fleetgo
  labels:
    app: driver-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: driver-service
  template:
    metadata:
      labels:
        app: driver-service
    spec:
      serviceAccountName: driver-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: driver-service
        image: registry.fleetgo.example/fleetgo/driver-service:2.5.0
        ports:
        - containerPort: 8080
        env:
        - name: SERVICE_NAME
          value: driver-service
        - name: PORT
          value: '8080'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability:4318
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: driver-service-db
              key: password
        securityContext:
          privileged: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: driver-service
  namespace: fleetgo
spec:
  type: NodePort
  selector:
    app: driver-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
    nodePort: 30080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: driver-service-ingress
  namespace: fleetgo
spec:
  podSelector:
    matchLabels:
      app: driver-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ingress-gateway
    ports:
    - port: 8080
