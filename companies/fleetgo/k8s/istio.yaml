# FleetGo: Istio routing and policies
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: fleetgo-gateway
  namespace: fleetgo
spec:
  selector:
    app: ingress-gateway
  servers:
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: fleetgo-api-tls
    hosts:
    - api.fleetgo.example
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: fleetgo-api
  namespace: fleetgo
spec:
  hosts:
  - api.fleetgo.example
  gateways:
  - fleetgo-gateway
  http:
  - name: api-shipments
    match:
    - uri:
        prefix: /api/shipments
    rewrite:
      uri: /shipments
    route:
    - destination:
        host: shipment-service.fleetgo.svc.cluster.local
        port:
          number: 8080
  - name: api-tracking
    match:
    - uri:
        prefix: /api/tracking
    rewrite:
      uri: /tracking
    route:
    - destination:
        host: tracking-service.fleetgo.svc.cluster.local
        port:
          number: 8080
  - name: api-drivers
    match:
    - uri:
        prefix: /api/drivers
    rewrite:
      uri: /drivers
    route:
    - destination:
        host: driver-service.fleetgo.svc.cluster.local
        port:
          number: 8080
  - name: api-auth
    match:
    - uri:
        prefix: /api/auth
    rewrite:
      uri: /auth
    route:
    - destination:
        host: auth-service.fleetgo.svc.cluster.local
        port:
          number: 8080
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: require-session
  namespace: fleetgo
spec:
  selector:
    matchLabels:
      app: ingress-gateway
  action: CUSTOM
  provider:
    name: auth-service-ext-authz
  rules:
  - to:
    - operation:
        paths:
        - /api/shipments*
        - /api/tracking*
        - /api/drivers*
---
apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: login-local-ratelimit
  namespace: fleetgo
spec:
  workloadSelector:
    labels:
      app: ingress-gateway
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: GATEWAY
    patch:
      operation: INSERT_BEFORE
      value:
        name: envoy.filters.http.local_ratelimit
        typed_config:
          '@type': type.googleapis.com/udpa.type.v1.TypedStruct
          type_url: type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
          value:
            stat_prefix: login_rate_limiter
            token_bucket:
              max_tokens: 60
              tokens_per_fill: 60
              fill_interval: 60s
            filter_enabled:
              runtime_key: login_rl_enabled
              default_value:
                numerator: 100
                denominator: HUNDRED
            descriptors:
            - entries:
              - key: path
                value: /api/auth
              token_bucket:
                max_tokens: 60
                tokens_per_fill: 60
                fill_interval: 60s
