openapi: 3.0.3
info:
  title: FleetGo Auth Service API
  version: 1.2.0
servers:
- url: http://auth-service:8080
paths:
  /auth/session:
    post:
      operationId: post_auth_session
      summary: POST /auth/session
      tags:
      - auth-service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: string
                  role:
                    type: string
                  access_token:
                    type: string
                  token_type:
                    type: string
      security: []
  /auth/introspect:
    get:
      operationId: get_auth_introspect
      summary: GET /auth/introspect
      tags:
      - auth-service
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: string
                  role:
                    type: string
                  active:
                    type: boolean
        '401':
          description: No valid credential
      security:
      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
