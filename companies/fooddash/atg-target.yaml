# ATG Phase 1 configuration for FoodDash (read by docker/scan.py from /target/atg-target.yaml).
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
# Paths are relative to this folder, which ATG mounts read-only at /target.
target:
  name: FoodDash
  service_map:
    mesh-gateway:8080: mesh-gateway
    auth-service:3000: auth-service
    restaurant-service:3000: restaurant-service
    order-service:3000: order-service
    payment-service:3000: payment-service
    dispatch-service:3000: dispatch-service
    rider-service:3000: rider-service
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: mesh-gateway
      base_url: http://mesh-gateway:8080
    - service: auth-service
      base_url: http://auth-service:3000
    - service: restaurant-service
      base_url: http://restaurant-service:3000
    - service: order-service
      base_url: http://order-service:3000
    - service: payment-service
      base_url: http://payment-service:3000
    - service: dispatch-service
      base_url: http://dispatch-service:3000
    - service: rider-service
      base_url: http://rider-service:3000
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths: []
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
