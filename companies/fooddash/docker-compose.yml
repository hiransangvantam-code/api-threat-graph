      - CMD
      - node
      - service.js
      - --health
      interval: 2s
      timeout: 3s
      retries: 40
  rider-service:
    build: ../runtime/node
    image: atg-company-node:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: rider-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - fooddash-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - node
      - service.js
      - --health
      interval: 2s
      timeout: 3s
      retries: 40
  users:
    build: ../runtime/python
    image: atg-company-python:1.0
    profiles:
    - users
    restart: 'no'
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - fooddash-net
    command: python traffic.py --gateway http://atg-proxy:8080 --mesh-proxy http://atg-proxy:8081 --wait 120 --rounds 20
networks:
  fooddash-net:
    name: fooddash-net
