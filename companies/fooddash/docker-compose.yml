# FoodDash (Food delivery): the company's Docker for the ATG flexibility test.
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
#
# Services in node; gateway mesh-gateway plays istio; outside APIs: none.
# Network fooddash-net. The ATG platform joins it; the two settings marked for the review are
# MESH_PROXY (east-west calls through ATG's sidecar) and OTEL_EXPORTER_OTLP_ENDPOINT (spans to ATG).
#
#   docker compose -f companies/fooddash/docker-compose.yml up -d --build --wait
#   docker compose -f companies/fooddash/docker-compose.yml run --rm users
name: fooddash
services:
  mesh-gateway:
    build: ../runtime/node
    image: atg-company-node:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: mesh-gateway
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - fooddash-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - node
      - service.js
      - --health
      interval: 2s
      timeout: 3s
      retries: 40
  auth-service:
    build: ../runtime/node
    image: atg-company-node:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: auth-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - fooddash-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - node
      - service.js
      - --health
      interval: 2s
      timeout: 3s
      retries: 40
  restaurant-service:
    build: ../runtime/node
    image: atg-company-node:1.0
    environment:
      COMPANY: /company/company.json
