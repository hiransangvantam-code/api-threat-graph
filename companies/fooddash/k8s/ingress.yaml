# FoodDash: public entry point
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fooddash-api
  namespace: fooddash
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  rules:
  - host: api.fooddash.example
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mesh-gateway
            port:
              number: 8080
  tls:
  - hosts:
    - api.fooddash.example
    secretName: fooddash-api-tls
