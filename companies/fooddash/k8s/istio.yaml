# FoodDash: Istio routing and policies
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: fooddash-gateway
  namespace: fooddash
spec:
  selector:
    app: mesh-gateway
  servers:
  - port:
      number: 8080
      name: http
      protocol: HTTP
    hosts:
    - api.fooddash.example
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: fooddash-api
  namespace: fooddash
spec:
  hosts:
  - api.fooddash.example
  gateways:
  - fooddash-gateway
  http:
  - name: api-restaurants
    match:
    - uri:
        prefix: /api/restaurants
    rewrite:
      uri: /restaurants
    route:
    - destination:
        host: restaurant-service.fooddash.svc.cluster.local
        port:
          number: 3000
  - name: api-payments
    match:
    - uri:
        prefix: /api/payments
    rewrite:
      uri: /payments
    route:
    - destination:
        host: payment-service.fooddash.svc.cluster.local
        port:
          number: 3000
  - name: api-orders
    match:
    - uri:
        prefix: /api/orders
    rewrite:
      uri: /orders
    route:
    - destination:
        host: order-service.fooddash.svc.cluster.local
        port:
          number: 3000
  - name: api-riders
    match:
    - uri:
        prefix: /api/riders
    rewrite:
      uri: /riders
    route:
    - destination:
        host: rider-service.fooddash.svc.cluster.local
        port:
          number: 3000
  - name: api-auth
    match:
    - uri:
        prefix: /api/auth
    rewrite:
      uri: /auth
    route:
    - destination:
        host: auth-service.fooddash.svc.cluster.local
        port:
          number: 3000
---
apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: require-session
  namespace: fooddash
spec:
  selector:
    matchLabels:
      app: mesh-gateway
  action: CUSTOM
  provider:
    name: auth-service-ext-authz
  rules:
  - to:
    - operation:
        paths:
        - /api/restaurants*
        - /api/orders*
        - /api/payments*
        - /api/riders*
