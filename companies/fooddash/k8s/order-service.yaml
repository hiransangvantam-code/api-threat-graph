# FoodDash: order-service
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  namespace: fooddash
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: order-service-db
  namespace: fooddash
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: order-service-db
  data:
  - secretKey: password
    remoteRef:
      key: fooddash/order-service/db
      property: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: fooddash
  labels:
    app: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      serviceAccountName: order-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: order-service
        image: registry.fooddash.example/fooddash/order-service:5.4.0
        ports:
        - containerPort: 3000
        env:
        - name: SERVICE_NAME
          value: order-service
        - name: PORT
          value: '3000'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability:4318
        - name: DISPATCH_SERVICE_URL
          value: http://dispatch-service:3000
        - name: PAYMENT_SERVICE_URL
          value: http://payment-service:3000
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: order-service-db
              key: password
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: fooddash
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-service-ingress
  namespace: fooddash
spec:
  podSelector:
    matchLabels:
      app: order-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: mesh-gateway
    ports:
    - port: 3000
