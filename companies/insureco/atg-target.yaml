# ATG Phase 1 configuration for InsureCo (read by docker/scan.py from /target/atg-target.yaml).
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
# Paths are relative to this folder, which ATG mounts read-only at /target.
target:
  name: InsureCo
  service_map:
    api-gateway:8080: api-gateway
    auth-service:8000: auth-service
    policy-service:8000: policy-service
    claim-service:8000: claim-service
    underwriting-service:8000: underwriting-service
    reporting-service:8000: reporting-service
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: api-gateway
      base_url: http://api-gateway:8080
    - service: auth-service
      base_url: http://auth-service:8000
    - service: policy-service
      base_url: http://policy-service:8000
    - service: claim-service
      base_url: http://claim-service:8000
    - service: underwriting-service
      base_url: http://underwriting-service:8000
    - service: reporting-service
      base_url: http://reporting-service:8000
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths: []
    gateway_configs:
    - path: gateway/application.yml
      type: spring-cloud-gateway
      service: api-gateway
      env_from:
      - k8s/gateway.yaml
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
