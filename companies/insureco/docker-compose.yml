# InsureCo (Insurance (motor claims)): the company's Docker for the ATG flexibility test.
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
#
# Services in python; gateway api-gateway plays spring-cloud-gateway; outside APIs: none.
# Network insureco-net. The ATG platform joins it; the two settings marked for the review are
# MESH_PROXY (east-west calls through ATG's sidecar) and OTEL_EXPORTER_OTLP_ENDPOINT (spans to ATG).
#
#   docker compose -f companies/insureco/docker-compose.yml up -d --build --wait
#   docker compose -f companies/insureco/docker-compose.yml run --rm users
name: insureco
services:
  api-gateway:
    build: ../runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: api-gateway
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - insureco-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  auth-service:
    build: ../runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: auth-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - insureco-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  policy-service:
    build: ../runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: policy-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - insureco-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  claim-service:
    build: ../runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: claim-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - insureco-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  underwriting-service:
    build: ../runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: underwriting-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - insureco-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  reporting-service:
    build: ../runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: reporting-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - insureco-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  users:
    build: ../runtime/python
    image: atg-company-python:1.0
    profiles:
    - users
    restart: 'no'
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - insureco-net
    command: python traffic.py --gateway http://atg-proxy:8080 --mesh-proxy http://atg-proxy:8081 --wait 120 --rounds 20
networks:
  insureco-net:
    name: insureco-net
