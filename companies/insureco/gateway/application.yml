# InsureCo: Spring Cloud Gateway (api-gateway) application.yml
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
      - DedupeResponseHeader=Access-Control-Allow-Origin
      routes:
      - id: api-auth
        uri: ${AUTH_SERVICE_URL:http://auth-service:8000}
        predicates:
        - Path=/api/auth/**
        filters:
        - StripPrefix=1
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 1
            redis-rate-limiter.burstCapacity: 5
            key-resolver: '#{@ipKeyResolver}'
      - id: api-claims
        uri: ${CLAIM_SERVICE_URL:http://claim-service:8000}
        predicates:
        - Path=/api/claims/**
        filters:
        - StripPrefix=1
        - TokenRelay=
      - id: api-policies
        uri: ${POLICY_SERVICE_URL:http://policy-service:8000}
        predicates:
        - Path=/api/policies/**
        filters:
        - StripPrefix=1
        - TokenRelay=
      - id: api-reports
        uri: ${REPORTING_SERVICE_URL:http://reporting-service:8000}
        predicates:
        - Path=/api/reports/**
        filters:
        - StripPrefix=1
management:
  endpoints:
    web:
      exposure:
        include: health
