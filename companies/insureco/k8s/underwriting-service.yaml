# InsureCo: underwriting-service
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: underwriting-service
  namespace: insureco
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: underwriting-service-db
  namespace: insureco
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: underwriting-service-db
  data:
  - secretKey: password
    remoteRef:
      key: insureco/underwriting-service/db
      property: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: underwriting-service
  namespace: insureco
  labels:
    app: underwriting-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: underwriting-service
  template:
    metadata:
      labels:
        app: underwriting-service
    spec:
      serviceAccountName: underwriting-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: underwriting-service
        image: registry.insureco.example/insureco/underwriting-service:1.4.0
        ports:
        - containerPort: 8000
        env:
        - name: SERVICE_NAME
          value: underwriting-service
        - name: PORT
          value: '8000'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability:4318
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: underwriting-service-db
              key: password
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: underwriting-service
  namespace: insureco
spec:
  type: ClusterIP
  selector:
    app: underwriting-service
  ports:
  - name: http
    port: 8000
    targetPort: 8000
