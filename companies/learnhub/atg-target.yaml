# ATG Phase 1 configuration for LearnHub (read by docker/scan.py from /target/atg-target.yaml).
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
# Paths are relative to this folder, which ATG mounts read-only at /target.
target:
  name: LearnHub
  service_map:
    edge-gateway:8000: edge-gateway
    auth-service:3000: auth-service
    course-service:3000: course-service
    enrollment-service:3000: enrollment-service
    grade-service:3000: grade-service
    admin-service:3000: admin-service
    legacy-quiz-service:3000: legacy-quiz-service
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: edge-gateway
      base_url: http://edge-gateway:8000
    - service: auth-service
      base_url: http://auth-service:3000
    - service: course-service
      base_url: http://course-service:3000
    - service: enrollment-service
      base_url: http://enrollment-service:3000
    - service: grade-service
      base_url: http://grade-service:3000
    - service: admin-service
      base_url: http://admin-service:3000
    - service: legacy-quiz-service
      base_url: http://legacy-quiz-service:3000
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths: []
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
