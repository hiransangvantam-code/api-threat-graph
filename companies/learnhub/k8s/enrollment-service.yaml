# LearnHub: enrollment-service
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: enrollment-service
  namespace: learnhub
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: enrollment-service-db
  namespace: learnhub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: enrollment-service-db
  data:
  - secretKey: password
    remoteRef:
      key: learnhub/enrollment-service/db
      property: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enrollment-service
  namespace: learnhub
  labels:
    app: enrollment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enrollment-service
  template:
    metadata:
      labels:
        app: enrollment-service
    spec:
      serviceAccountName: enrollment-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: enrollment-service
        image: registry.learnhub.example/learnhub/enrollment-service:2.1.0
        ports:
        - containerPort: 3000
        env:
        - name: SERVICE_NAME
          value: enrollment-service
        - name: PORT
          value: '3000'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability:4318
        - name: COURSE_SERVICE_URL
          value: http://course-service:3000
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: enrollment-service-db
              key: password
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: enrollment-service
  namespace: learnhub
spec:
  type: ClusterIP
  selector:
    app: enrollment-service
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enrollment-service-ingress
  namespace: learnhub
spec:
  podSelector:
    matchLabels:
      app: enrollment-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: edge-gateway
    ports:
    - port: 3000
