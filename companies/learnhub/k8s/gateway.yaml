# LearnHub: API gateway (configmap)
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: edge-gateway
  namespace: learnhub
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-gateway
  namespace: learnhub
  labels:
    app: edge-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-gateway
  template:
    metadata:
      labels:
        app: edge-gateway
    spec:
      serviceAccountName: edge-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: edge-gateway
        image: registry.learnhub.example/learnhub/edge-gateway:1.8.0
        ports:
        - containerPort: 8000
        env:
        - name: PORT
          value: '8000'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability:4318
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: edge-gateway
  namespace: learnhub
spec:
  type: ClusterIP
  selector:
    app: edge-gateway
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-gateway-ingress
  namespace: learnhub
spec:
  podSelector:
    matchLabels:
      app: edge-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - port: 8000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-gateway-routes
  namespace: learnhub
data:
  routes.yaml: |
    routes:
    - prefix: /api/auth
      service: auth-service
      upstream: http://auth-service:3000
      strip_prefix: /api
      auth: none
      rate_limit: 60/m
    - prefix: /api/courses
      service: course-service
      upstream: http://course-service:3000
      strip_prefix: /api
      auth: required
    - prefix: /api/enrollments
      service: enrollment-service
      upstream: http://enrollment-service:3000
      strip_prefix: /api
      auth: required
    - prefix: /api/grades
      service: grade-service
      upstream: http://grade-service:3000
      strip_prefix: /api
      auth: required
    - prefix: /api/admin
      service: admin-service
      upstream: http://admin-service:3000
      strip_prefix: /api
      auth: required
    - prefix: /api/quizzes
      service: legacy-quiz-service
      upstream: http://legacy-quiz-service:3000
      strip_prefix: /api
      auth: required
