# LearnHub: grade-service
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grade-service
  namespace: learnhub
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grade-service-db
  namespace: learnhub
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: grade-service-db
  data:
  - secretKey: password
    remoteRef:
      key: learnhub/grade-service/db
      property: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-service
  namespace: learnhub
  labels:
    app: grade-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grade-service
  template:
    metadata:
      labels:
        app: grade-service
    spec:
      serviceAccountName: grade-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grade-service
        image: registry.learnhub.example/learnhub/grade-service:1.6.1
        ports:
        - containerPort: 3000
        env:
        - name: SERVICE_NAME
          value: grade-service
        - name: PORT
          value: '3000'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability:4318
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grade-service-db
              key: password
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: grade-service
  namespace: learnhub
spec:
  type: ClusterIP
  selector:
    app: grade-service
  ports:
  - name: http
    port: 3000
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grade-service-ingress
  namespace: learnhub
spec:
  podSelector:
    matchLabels:
      app: grade-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: edge-gateway
    ports:
    - port: 3000
