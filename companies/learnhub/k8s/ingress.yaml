# LearnHub: public entry point
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: learnhub-api
  namespace: learnhub
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  rules:
  - host: api.learnhub.example
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: edge-gateway
            port:
              number: 8000
  tls:
  - hosts:
    - api.learnhub.example
    secretName: learnhub-api-tls
