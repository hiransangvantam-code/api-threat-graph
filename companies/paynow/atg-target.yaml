# ATG Phase 1 configuration for PayNow (read by docker/scan.py from /target/atg-target.yaml).
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
# Paths are relative to this folder, which ATG mounts read-only at /target.
target:
  name: PayNow
  service_map:
    kong:8000: kong
    auth-service:8080: auth-service
    wallet-service:8080: wallet-service
    transfer-service:8080: transfer-service
    ledger-service:8080: ledger-service
    merchant-service:8080: merchant-service
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: kong
      base_url: http://kong:8000
    - service: auth-service
      base_url: http://auth-service:8080
    - service: wallet-service
      base_url: http://wallet-service:8080
    - service: transfer-service
      base_url: http://transfer-service:8080
    - service: ledger-service
      base_url: http://ledger-service:8080
    - service: merchant-service
      base_url: http://merchant-service:8080
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths: []
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
