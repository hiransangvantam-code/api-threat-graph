# PayNow: Kong declarative configuration (DB-less), packed into the kong-declarative ConfigMap by kustomize.
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
_format_version: '3.0'
_transform: true
services:
- name: auth-service-api-auth
  url: http://auth-service:8080/auth
  routes:
  - name: api-auth
    paths:
    - /api/auth
    strip_path: true
    plugins:
    - name: rate-limiting
      config:
        minute: 60
        policy: local
- name: wallet-service-api-wallets
  url: http://wallet-service:8080/wallets
  routes:
  - name: api-wallets
    paths:
    - /api/wallets
    strip_path: true
    plugins:
    - name: jwt
- name: transfer-service-api-transfers
  url: http://transfer-service:8080/transfers
  routes:
  - name: api-transfers
    paths:
    - /api/transfers
    strip_path: true
    plugins:
    - name: jwt
- name: merchant-service-api-merchants
  url: http://merchant-service:8080/merchants
  routes:
  - name: api-merchants
    paths:
    - /api/merchants
    strip_path: true
    plugins:
    - name: jwt
