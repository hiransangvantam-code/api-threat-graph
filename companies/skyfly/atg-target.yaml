# ATG Phase 1 configuration for SkyFly (read by docker/scan.py from /target/atg-target.yaml).
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
# Paths are relative to this folder, which ATG mounts read-only at /target.
target:
  name: SkyFly
  service_map:
    api-gateway:8080: api-gateway
    auth-service:3000: auth-service
    flight-service:3000: flight-service
    booking-service:3000: booking-service
    checkin-service:3000: checkin-service
    partner-api:3000: partner-api
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: api-gateway
      base_url: http://api-gateway:8080
    - service: auth-service
      base_url: http://auth-service:3000
    - service: flight-service
      base_url: http://flight-service:3000
    - service: booking-service
      base_url: http://booking-service:3000
    - service: checkin-service
      base_url: http://checkin-service:3000
    - service: partner-api
      base_url: http://partner-api:3000
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths: []
    gateway_configs:
    - path: gateway/application.yml
      type: spring-cloud-gateway
      service: api-gateway
      env_from:
      - k8s/gateway.yaml
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
