# SkyFly (Airline (booking and check-in)): the company's Docker for the ATG flexibility test.
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
#
# Services in node; gateway api-gateway plays spring-cloud-gateway; outside APIs: gds-provider.
# Network skyfly-net. The ATG platform joins it; the two settings marked for the review are
# MESH_PROXY (east-west calls through ATG's sidecar) and OTEL_EXPORTER_OTLP_ENDPOINT (spans to ATG).
#
#   docker compose -f companies/skyfly/docker-compose.yml up -d --build --wait
#   docker compose -f companies/skyfly/docker-compose.yml run --rm users
name: skyfly
services:
  api-gateway:
    build: ../runtime/node
    image: atg-company-node:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: api-gateway
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - skyfly-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - node
      - service.js
      - --health
      interval: 2s
      timeout: 3s
      retries: 40
  auth-service:
    build: ../runtime/node
    image: atg-company-node:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: auth-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - skyfly-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - node
      - service.js
      - --health
      interval: 2s
      timeout: 3s
      retries: 40
  flight-service:
    build: ../runtime/node
    image: atg-company-node:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: flight-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - skyfly-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - node
      - service.js
      - --health
      interval: 2s
      timeout: 3s
      retries: 40
  booking-service:
    build: ../runtime/node
    image: atg-company-node:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: booking-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - skyfly-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - node
      - service.js
      - --health
      interval: 2s
      timeout: 3s
      retries: 40
  checkin-service:
    build: ../runtime/node
    image: atg-company-node:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: checkin-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - skyfly-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - node
      - service.js
      - --health
      interval: 2s
      timeout: 3s
      retries: 40
  partner-api:
    build: ../runtime/node
    image: atg-company-node:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: partner-api
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - skyfly-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - node
      - service.js
      - --health
      interval: 2s
      timeout: 3s
      retries: 40
  gds-provider:
    build: ../runtime/node
    image: atg-company-node:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: gds-provider
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - skyfly-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - node
      - service.js
      - --health
      interval: 2s
      timeout: 3s
      retries: 40
  users:
    build: ../runtime/python
    image: atg-company-python:1.0
    profiles:
    - users
    restart: 'no'
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - skyfly-net
    command: python traffic.py --gateway http://atg-proxy:8080 --mesh-proxy http://atg-proxy:8081 --wait 120 --rounds 20
networks:
  skyfly-net:
    name: skyfly-net
