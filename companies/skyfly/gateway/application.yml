# SkyFly: Spring Cloud Gateway (api-gateway) application.yml
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
      - DedupeResponseHeader=Access-Control-Allow-Origin
      routes:
      - id: api-auth
        uri: ${AUTH_SERVICE_URL:http://auth-service:3000}
        predicates:
        - Path=/api/auth/**
        filters:
        - StripPrefix=1
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 1
            redis-rate-limiter.burstCapacity: 5
            key-resolver: '#{@ipKeyResolver}'
      - id: api-bookings
        uri: ${BOOKING_SERVICE_URL:http://booking-service:3000}
        predicates:
        - Path=/api/bookings/**
        filters:
        - StripPrefix=1
        - TokenRelay=
      - id: api-checkin
        uri: ${CHECKIN_SERVICE_URL:http://checkin-service:3000}
        predicates:
        - Path=/api/checkin/**
        filters:
        - StripPrefix=1
      - id: api-flights
        uri: ${FLIGHT_SERVICE_URL:http://flight-service:3000}
        predicates:
        - Path=/api/flights/**
        filters:
        - StripPrefix=1
        - TokenRelay=
      - id: partner
        uri: ${PARTNER_API_URL:http://partner-api:3000}
        predicates:
        - Path=/partner/**
        filters:
        - TokenRelay=
management:
  endpoints:
    web:
      exposure:
        include: health
