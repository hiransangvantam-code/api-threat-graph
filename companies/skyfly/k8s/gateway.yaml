# SkyFly: API gateway (spring-cloud-gateway)
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: skyfly
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: skyfly
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: api-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api-gateway
        image: registry.skyfly.example/skyfly/api-gateway:3.1.4
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: '8080'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability:4318
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: api-gateway-env
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: skyfly
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-ingress
  namespace: skyfly
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - port: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-env
  namespace: skyfly
data:
  AUTH_SERVICE_URL: http://auth-service:3000
  FLIGHT_SERVICE_URL: http://flight-service:3000
  BOOKING_SERVICE_URL: http://booking-service:3000
  CHECKIN_SERVICE_URL: http://checkin-service:3000
  PARTNER_API_URL: http://partner-api:3000
