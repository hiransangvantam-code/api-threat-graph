# SkyFly: public entry point
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skyfly-api
  namespace: skyfly
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  rules:
  - host: api.skyfly.example
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api-gateway
            port:
              number: 8080
  tls:
  - hosts:
    - api.skyfly.example
    secretName: skyfly-api-tls
