# ATG Phase 1 configuration for StreamBox (read by docker/scan.py from /target/atg-target.yaml).
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
# Paths are relative to this folder, which ATG mounts read-only at /target.
target:
  name: StreamBox
  service_map:
    kong:8000: kong
    auth-service:8000: auth-service
    catalog-service:8000: catalog-service
    profile-service:8000: profile-service
    billing-service:8000: billing-service
    recommendation-service:8000: recommendation-service
    drm-service:8000: drm-service
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: kong
      base_url: http://kong:8000
    - service: auth-service
      base_url: http://auth-service:8000
    - service: catalog-service
      base_url: http://catalog-service:8000
    - service: profile-service
      base_url: http://profile-service:8000
    - service: billing-service
      base_url: http://billing-service:8000
    - service: recommendation-service
      base_url: http://recommendation-service:8000
    - service: drm-service
      base_url: http://drm-service:8000
    spec_files:
    - path: specs/billing-service.v1.json
      service: billing-service
  infrastructure:
    enabled: true
    manifest_paths: []
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
