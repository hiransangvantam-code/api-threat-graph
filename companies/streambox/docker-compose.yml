# StreamBox (Media (video streaming)): the company's Docker for the ATG flexibility test.
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
#
# Services in python; gateway kong plays kong; outside APIs: none.
# Network streambox-net. The ATG platform joins it; the two settings marked for the review are
# MESH_PROXY (east-west calls through ATG's sidecar) and OTEL_EXPORTER_OTLP_ENDPOINT (spans to ATG).
#
#   docker compose -f companies/streambox/docker-compose.yml up -d --build --wait
#   docker compose -f companies/streambox/docker-compose.yml run --rm users
name: streambox
services:
  kong:
    build: ../runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: kong
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - streambox-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  auth-service:
    build: ../runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: auth-service
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    networks:
    - streambox-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
