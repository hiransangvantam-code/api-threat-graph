# StreamBox: auth-service
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  namespace: streambox
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: auth-service-db
  namespace: streambox
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: auth-service-db
  data:
  - secretKey: password
    remoteRef:
      key: streambox/auth-service/db
      property: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: streambox
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: auth-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: auth-service
        image: registry.streambox.example/streambox/auth-service:3.0.0
        ports:
        - containerPort: 8000
        env:
        - name: SERVICE_NAME
          value: auth-service
        - name: PORT
          value: '8000'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability:4318
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: auth-service-db
              key: password
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: streambox
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
  - name: http
    port: 8000
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-service-ingress
  namespace: streambox
spec:
  podSelector:
    matchLabels:
      app: auth-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: kong
    ports:
    - port: 8000
