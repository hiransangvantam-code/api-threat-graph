# StreamBox: public entry point
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streambox-api
  namespace: streambox
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  rules:
  - host: www.streambox.example
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: kong
            port:
              number: 8000
  tls:
  - hosts:
    - www.streambox.example
    secretName: streambox-api-tls
