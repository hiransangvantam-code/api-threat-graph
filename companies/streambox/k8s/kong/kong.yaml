# StreamBox: Kong declarative configuration (DB-less), packed into the kong-declarative ConfigMap by kustomize.
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
_format_version: '3.0'
_transform: true
services:
- name: auth-service-auth
  url: http://auth-service:8000
  routes:
  - name: auth
    paths:
    - /auth
    strip_path: false
    plugins:
    - name: rate-limiting
      config:
        minute: 60
        policy: local
- name: catalog-service-api-catalog
  url: http://catalog-service:8000
  routes:
  - name: api-catalog
    paths:
    - /api/catalog
    strip_path: true
    plugins:
    - name: openid-connect
      config:
        issuer: https://login.streambox.example/
        auth_methods:
        - session
- name: profile-service-api-account
  url: http://profile-service:8000
  routes:
  - name: api-account
    paths:
    - /api/account
    strip_path: true
    plugins:
    - name: openid-connect
      config:
        issuer: https://login.streambox.example/
        auth_methods:
        - session
- name: billing-service-billing
  url: http://billing-service:8000
  routes:
  - name: billing
    paths:
    - /billing
    strip_path: false
    plugins:
    - name: openid-connect
      config:
        issuer: https://login.streambox.example/
        auth_methods:
        - session
