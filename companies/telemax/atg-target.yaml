# ATG Phase 1 configuration for TeleMax (read by docker/scan.py from /target/atg-target.yaml).
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
# Paths are relative to this folder, which ATG mounts read-only at /target.
target:
  name: TeleMax
  service_map:
    api-gateway:8080: api-gateway
    auth-service:8080: auth-service
    subscriber-service:8080: subscriber-service
    plan-service:8080: plan-service
    usage-service:8080: usage-service
    billing-service:8080: billing-service
    sim-service:8080: sim-service
    network-ops-service:8080: network-ops-service
    number-porting-service:8080: number-porting-service
    device-service:8080: device-service
    support-service:8080: support-service
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: api-gateway
      base_url: http://api-gateway:8080
    - service: auth-service
      base_url: http://auth-service:8080
    - service: subscriber-service
      base_url: http://subscriber-service:8080
    - service: plan-service
      base_url: http://plan-service:8080
    - service: usage-service
      base_url: http://usage-service:8080
    - service: billing-service
      base_url: http://billing-service:8080
    - service: sim-service
      base_url: http://sim-service:8080
    - service: network-ops-service
      base_url: http://network-ops-service:8080
    - service: number-porting-service
      base_url: http://number-porting-service:8080
    - service: device-service
      base_url: http://device-service:8080
    - service: support-service
      base_url: http://support-service:8080
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths: []
    gateway_configs:
    - path: gateway/application.yml
      type: spring-cloud-gateway
      service: api-gateway
      env_from:
      - k8s/gateway.yaml
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
