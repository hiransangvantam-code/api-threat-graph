# TeleMax (Telecom (mobile operator)): the company's Docker for the ATG flexibility test.
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
#
# Services in go; gateway api-gateway plays spring-cloud-gateway; outside APIs: bank-switch.
# Network telemax-net. The ATG platform joins it; the two settings marked for the review are
# MESH_PROXY (east-west calls through ATG's sidecar) and OTEL_EXPORTER_OTLP_ENDPOINT (spans to ATG).
#
#   docker compose -f companies/telemax/docker-compose.yml up -d --build --wait
#   docker compose -f companies/telemax/docker-compose.yml run --rm users
name: telemax
services:
  api-gateway:
    build: ../runtime/go
    image: atg-company-go:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: api-gateway
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - telemax-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - /app/service
      - -health
      interval: 2s
      timeout: 3s
      retries: 40
  auth-service:
    build: ../runtime/go
    image: atg-company-go:1.0
    environment:
      COMPANY: /company/company.json
