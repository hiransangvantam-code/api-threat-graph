# TeleMax: Spring Cloud Gateway (api-gateway) application.yml
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
      - DedupeResponseHeader=Access-Control-Allow-Origin
      routes:
      - id: api-auth
        uri: ${AUTH_SERVICE_URL:http://auth-service:8080}
        predicates:
        - Path=/api/auth/**
        filters:
        - RewritePath=/api/(?<segment>.*), /${segment}
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 1
            redis-rate-limiter.burstCapacity: 5
            key-resolver: '#{@ipKeyResolver}'
      - id: api-bills
        uri: ${BILLING_SERVICE_URL:http://billing-service:8080}
        predicates:
        - Path=/api/bills/**
        filters:
        - RewritePath=/api/(?<segment>.*), /${segment}
        - TokenRelay=
      - id: api-devices
        uri: ${DEVICE_SERVICE_URL:http://device-service:8080}
        predicates:
        - Path=/api/devices/**
        filters:
        - RewritePath=/api/(?<segment>.*), /${segment}
        - TokenRelay=
      - id: api-plans
        uri: ${PLAN_SERVICE_URL:http://plan-service:8080}
        predicates:
        - Path=/api/plans/**
        filters:
        - RewritePath=/api/(?<segment>.*), /${segment}
        - TokenRelay=
      - id: api-porting
        uri: ${NUMBER_PORTING_SERVICE_URL:http://number-porting-service:8080}
        predicates:
        - Path=/api/porting/**
        filters:
        - RewritePath=/api/(?<segment>.*), /${segment}
        - TokenRelay=
      - id: api-sims
        uri: ${SIM_SERVICE_URL:http://sim-service:8080}
        predicates:
        - Path=/api/sims/**
        filters:
        - RewritePath=/api/(?<segment>.*), /${segment}
        - TokenRelay=
      - id: api-subscribers
        uri: ${SUBSCRIBER_SERVICE_URL:http://subscriber-service:8080}
        predicates:
        - Path=/api/subscribers/**
        filters:
        - RewritePath=/api/(?<segment>.*), /${segment}
        - TokenRelay=
      - id: api-tickets
        uri: ${SUPPORT_SERVICE_URL:http://support-service:8080}
        predicates:
        - Path=/api/tickets/**
        filters:
        - RewritePath=/api/(?<segment>.*), /${segment}
        - TokenRelay=
      - id: api-usage
        uri: ${USAGE_SERVICE_URL:http://usage-service:8080}
        predicates:
        - Path=/api/usage/**
        filters:
        - RewritePath=/api/(?<segment>.*), /${segment}
        - TokenRelay=
management:
  endpoints:
    web:
      exposure:
        include: health
