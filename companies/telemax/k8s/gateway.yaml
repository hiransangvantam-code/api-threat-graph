# TeleMax: API gateway (spring-cloud-gateway)
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: telemax
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: telemax
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      serviceAccountName: api-gateway
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api-gateway
        image: registry.telemax.example/telemax/api-gateway:4.1.2
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: '8080'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability:4318
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: api-gateway-env
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: telemax
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-gateway-ingress
  namespace: telemax
spec:
  podSelector:
    matchLabels:
      app: api-gateway
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - port: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-env
  namespace: telemax
data:
  AUTH_SERVICE_URL: http://auth-service:8080
  SUBSCRIBER_SERVICE_URL: http://subscriber-service:8080
  PLAN_SERVICE_URL: http://plan-service:8080
  USAGE_SERVICE_URL: http://usage-service:8080
  BILLING_SERVICE_URL: http://billing-service:8080
  SIM_SERVICE_URL: http://sim-service:8080
  NETWORK_OPS_SERVICE_URL: http://network-ops-service:8080
  NUMBER_PORTING_SERVICE_URL: http://number-porting-service:8080
  DEVICE_SERVICE_URL: http://device-service:8080
  SUPPORT_SERVICE_URL: http://support-service:8080
