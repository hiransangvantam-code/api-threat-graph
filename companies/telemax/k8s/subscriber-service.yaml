# TeleMax: subscriber-service
# Generated by companies/build.py from company.yaml. Edit company.yaml, not this file.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: subscriber-service
  namespace: telemax
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: subscriber-service-db
  namespace: telemax
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault
    kind: ClusterSecretStore
  target:
    name: subscriber-service-db
  data:
  - secretKey: password
    remoteRef:
      key: telemax/subscriber-service/db
      property: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriber-service
  namespace: telemax
  labels:
    app: subscriber-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: subscriber-service
  template:
    metadata:
      labels:
        app: subscriber-service
    spec:
      serviceAccountName: subscriber-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: subscriber-service
        image: registry.telemax.example/telemax/subscriber-service:8.0.1
        ports:
        - containerPort: 8080
        env:
        - name: SERVICE_NAME
          value: subscriber-service
        - name: PORT
          value: '8080'
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://otel-collector.observability:4318
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: subscriber-service-db
              key: password
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: subscriber-service
  namespace: telemax
spec:
  type: ClusterIP
  selector:
    app: subscriber-service
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: subscriber-service-ingress
  namespace: telemax
spec:
  podSelector:
    matchLabels:
      app: subscriber-service
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api-gateway
    - podSelector:
        matchLabels:
          app: sim-service
    ports:
    - port: 8080
