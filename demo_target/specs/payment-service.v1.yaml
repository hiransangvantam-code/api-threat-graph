# Hand-written spec checked into the repo two releases ago.
# It only knows about /charge. /refund and /admin/transactions came later.
openapi: 3.0.3
info:
  title: payment-service
  version: 0.7.0
servers:
  - url: http://payment-service:8003
paths:
  /charge:
    post:
      summary: Charge a card token
      operationId: charge
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, amount, card_token]
              properties:
                user_id: {type: integer}
                amount: {type: number}
                card_token: {type: string}
      responses:
        "200":
          description: Captured
components:
  securitySchemes:
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
