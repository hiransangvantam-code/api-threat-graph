# The ATG platform: OUR Docker. It runs next to the company's Docker (target/) and
# joins the company's network, customer-net, so nothing leaves that network.
#
#   1. company system:  docker compose -f target/docker-compose.yml up -d --build
#   2. ATG platform:    docker compose up -d --build              -> http://localhost:8080
#   3. customers:       docker compose -f target/docker-compose.yml run --rm users
#   4. scan:            docker compose exec atg python docker/scan.py --label vulnerable
#   START-Windows.bat / sh start.sh do all of it, plus a second scan after the fixes.
#
# Phase 1 sources and where they come from:
#   runtime traffic   atg-proxy      mitmproxy, inline in front of the gateway (:8080) and as the
#                                    services' east-west proxy (:8081)
#   traces            atg-collector  OpenTelemetry Collector; the services export spans over OTLP
#   OpenAPI           atg            probes the services' /openapi.json over customer-net
#   infrastructure    atg            the company's manifests and gateway routes, mounted read-only
# Phase 2 EUJF records and the Phase 3 threat graph go to atg-postgres.
name: atg

x-atg-image: &atg-image
  build: .
  image: api-threat-graph:1.2

services:
  atg-proxy:
    <<: *atg-image
    command: >
      mitmdump -q -s extractor/mitm_addon.py
      --mode reverse:${TARGET_GATEWAY:-http://api-gateway:8000}@8080
      --mode regular@8081
      --set atg_capture=/data/capture/flows.jsonl
    volumes:
      - atg-capture:/data/capture
    networks: [customer-net]

  atg-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    user: "0:0"                     # so it can write to the shared volume
    command: ["--config=/etc/atg/otel-collector.yaml"]
    volumes:
      - ./docker/otel-collector.yaml:/etc/atg/otel-collector.yaml:ro
      - atg-telemetry:/data/telemetry
    networks: [customer-net]

  atg-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atg
      POSTGRES_PASSWORD: atg
      POSTGRES_DB: atg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atg -d atg"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [atg-internal]

  atg:
    <<: *atg-image
    init: true
    depends_on:
      atg-postgres:
        condition: service_healthy
      atg-proxy:
        condition: service_started
      atg-collector:
        condition: service_started
    environment:
      ATG_GRAPH_STORE: postgresql://atg:atg@atg-postgres:5432/atg
      ATG_PUBLIC_URL: http://localhost:${ATG_PORT:-8080}
    ports:
      - "${ATG_PORT:-8080}:8888"
    volumes:
      - atg-capture:/data/capture:ro
      - atg-telemetry:/data/telemetry:ro
      - ${TARGET_CONFIG:-./demo_target}:/target:ro   # the company's manifests, gateway routes and spec files
      - ./output:/app/output                          # every page and JSON file, also on your machine
    networks: [atg-internal, customer-net]

volumes:
  atg-capture:
  atg-telemetry:

networks:
  atg-internal:
  customer-net:
    external: true
    name: customer-net
