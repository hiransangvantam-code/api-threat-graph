# OpenTelemetry Collector of the ATG platform (Phase 1, distributed trace discovery).
# The target's services export spans here over OTLP (W3C traceparent propagation);
# the file exporter writes OTLP/JSON lines that the call-chain extractor reads.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317
  zipkin:                      # Spring Boot (Micrometer/Sleuth), Istio/Envoy
    endpoint: 0.0.0.0:9411
  jaeger:                      # older Jaeger clients (DeathStarBench, ...)
    protocols:
      thrift_http:
        endpoint: 0.0.0.0:14268
      grpc:
        endpoint: 0.0.0.0:14250
      thrift_compact:          # the Jaeger agent protocol (UDP), for clients that send to jaeger:6831
        endpoint: 0.0.0.0:6831

processors:
  batch:
    timeout: 1s

exporters:
  file:
    path: /data/telemetry/spans.jsonl
    append: true               # O_APPEND, so the scanner can clear the file while the Collector runs
    flush_interval: 1s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp, zipkin, jaeger]
      processors: [batch]
      exporters: [file]
