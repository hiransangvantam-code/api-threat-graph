# ATG Phase 1 configuration for Acme Air: the real deployment files under upstream/ (from
# opensource/fetch.py) and the stand-ins' traffic and traces. Generated by opensource/build.py from system.yaml. Edit system.yaml, not this file.
target:
  name: Acme Air
  service_map:
    ingress-nginx-controller:80: ingress-nginx-controller
    acmeair-main-service:9080: acmeair-main-service
    acmeair-auth-service:9080: acmeair-auth-service
    acmeair-booking-service:9080: acmeair-booking-service
    acmeair-customer-service:9080: acmeair-customer-service
    acmeair-flight-service:9080: acmeair-flight-service
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: ingress-nginx-controller
      base_url: http://ingress-nginx-controller:80
    - service: acmeair-main-service
      base_url: http://acmeair-main-service:9080
    - service: acmeair-auth-service
      base_url: http://acmeair-auth-service:9080
    - service: acmeair-booking-service
      base_url: http://acmeair-booking-service:9080
    - service: acmeair-customer-service
      base_url: http://acmeair-customer-service:9080
    - service: acmeair-flight-service
      base_url: http://acmeair-flight-service:9080
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths:
    - upstream/mainservice/manifests
    - upstream/authservice/manifests
    - upstream/bookingservice/manifests
    - upstream/customerservice/manifests
    - upstream/flightservice/manifests
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
