# Acme Air (Airline): stand-in services for the open-source benchmark.
# Generated by opensource/build.py from system.yaml. Edit system.yaml, not this file.
# Real code: https://github.com/blueperf/acmeair-mainservice-java. Same service names and ports;
# the containers run companies/runtime/python, not the system's own code.
name: oss-acme-air
services:
  keygen:
    image: atg-company-python:1.0
    build: ../../companies/runtime/python
    user: '0'
    networks:
    - acme-air-net
    command:
    - python
    - -c
    - import secrets,os; p='/keys/token-key'; os.path.exists(p) or open(p,'w').write(secrets.token_hex(32))
    volumes:
    - keys:/keys
    restart: 'no'
  ingress-nginx-controller:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: ingress-nginx-controller
      MESH_PROXY: http://atg-proxy:8081
      TOKEN_KEY_FILE: /keys/token-key
    volumes:
    - ./company.json:/company/company.json:ro
    - keys:/keys:ro
    networks:
    - acme-air-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:80/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  acmeair-main-service:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: acmeair-main-service
      MESH_PROXY: http://atg-proxy:8081
      TOKEN_KEY_FILE: /keys/token-key
    volumes:
    - ./company.json:/company/company.json:ro
    - keys:/keys:ro
    networks:
    - acme-air-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9080/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  acmeair-auth-service:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: acmeair-auth-service
      MESH_PROXY: http://atg-proxy:8081
      TOKEN_KEY_FILE: /keys/token-key
    volumes:
    - ./company.json:/company/company.json:ro
    - keys:/keys:ro
    networks:
    - acme-air-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9080/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  acmeair-booking-service:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: acmeair-booking-service
      MESH_PROXY: http://atg-proxy:8081
      TOKEN_KEY_FILE: /keys/token-key
    volumes:
    - ./company.json:/company/company.json:ro
    - keys:/keys:ro
    networks:
    - acme-air-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9080/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  acmeair-customer-service:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: acmeair-customer-service
      MESH_PROXY: http://atg-proxy:8081
      TOKEN_KEY_FILE: /keys/token-key
    volumes:
    - ./company.json:/company/company.json:ro
    - keys:/keys:ro
    networks:
    - acme-air-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9080/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  acmeair-flight-service:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: acmeair-flight-service
      MESH_PROXY: http://atg-proxy:8081
      TOKEN_KEY_FILE: /keys/token-key
    volumes:
    - ./company.json:/company/company.json:ro
    - keys:/keys:ro
    networks:
    - acme-air-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9080/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  users:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    profiles:
    - users
    restart: 'no'
    networks:
    - acme-air-net
    volumes:
    - ./company.json:/company/company.json:ro
    command: python traffic.py --gateway http://atg-proxy:8080 --mesh-proxy http://atg-proxy:8081 --wait 120 --rounds 15
networks:
  acme-air-net:
    name: acme-air-net
volumes:
  keys: {}
