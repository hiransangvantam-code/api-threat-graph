# ATG Phase 1 configuration for Bank of Anthos: the real deployment files under upstream/ (from
# opensource/fetch.py) and the stand-ins' traffic and traces. Generated by opensource/build.py from system.yaml. Edit system.yaml, not this file.
target:
  name: Bank of Anthos
  service_map:
    frontend:8080: frontend
    userservice:8080: userservice
    contacts:8080: contacts
    balancereader:8080: balancereader
    transactionhistory:8080: transactionhistory
    ledgerwriter:8080: ledgerwriter
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: frontend
      base_url: http://frontend:8080
    - service: userservice
      base_url: http://userservice:8080
    - service: contacts
      base_url: http://contacts:8080
    - service: balancereader
      base_url: http://balancereader:8080
    - service: transactionhistory
      base_url: http://transactionhistory:8080
    - service: ledgerwriter
      base_url: http://ledgerwriter:8080
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths:
    - upstream/kubernetes-manifests
    - upstream/extras/jwt/jwt-secret.yaml
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
