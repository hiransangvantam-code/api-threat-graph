# Bank of Anthos (Banking): stand-in services for the open-source benchmark.
# Generated by opensource/build.py from system.yaml. Edit system.yaml, not this file.
# Real code: https://github.com/GoogleCloudPlatform/bank-of-anthos. Same service names and ports;
# the containers run companies/runtime/python, not the system's own code.
name: oss-bank-of-anthos
services:
  keygen:
    image: atg-company-python:1.0
    build: ../../companies/runtime/python
    user: '0'
    networks:
    - bank-of-anthos-net
    command:
    - python
    - -c
    - import secrets,os; p='/keys/token-key'; os.path.exists(p) or open(p,'w').write(secrets.token_hex(32))
    volumes:
    - keys:/keys
    restart: 'no'
  frontend:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: frontend
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
      TOKEN_KEY_FILE: /keys/token-key
    volumes:
    - ./company.json:/company/company.json:ro
    - keys:/keys:ro
    networks:
    - bank-of-anthos-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  userservice:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: userservice
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
      TOKEN_KEY_FILE: /keys/token-key
    volumes:
    - ./company.json:/company/company.json:ro
    - keys:/keys:ro
    networks:
    - bank-of-anthos-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  contacts:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: contacts
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
