    volumes:
    - ./company.json:/company/company.json:ro
    - keys:/keys:ro
    networks:
    - bank-of-anthos-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  balancereader:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: balancereader
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
      TOKEN_KEY_FILE: /keys/token-key
    volumes:
    - ./company.json:/company/company.json:ro
    - keys:/keys:ro
    networks:
    - bank-of-anthos-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  transactionhistory:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: transactionhistory
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
      TOKEN_KEY_FILE: /keys/token-key
    volumes:
    - ./company.json:/company/company.json:ro
    - keys:/keys:ro
    networks:
    - bank-of-anthos-net
    restart: unless-stopped
