    volumes:
    - ./company.json:/company/company.json:ro
    - keys:/keys:ro
    networks:
    - bank-of-anthos-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  users:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    profiles:
    - users
    restart: 'no'
    networks:
    - bank-of-anthos-net
    volumes:
    - ./company.json:/company/company.json:ro
    command: python traffic.py --gateway http://atg-proxy:8080 --mesh-proxy http://atg-proxy:8081 --wait 120 --rounds 15
networks:
  bank-of-anthos-net:
    name: bank-of-anthos-net
volumes:
  keys: {}
