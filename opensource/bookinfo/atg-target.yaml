# ATG Phase 1 configuration for Istio Bookinfo: the real deployment files under upstream/ (from
# opensource/fetch.py) and the stand-ins' traffic and traces. Generated by opensource/build.py from system.yaml. Edit system.yaml, not this file.
target:
  name: Istio Bookinfo
  service_map:
    productpage:9080: productpage
    details:9080: details
    reviews:9080: reviews
    ratings:9080: ratings
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: productpage
      base_url: http://productpage:9080
    - service: details
      base_url: http://details:9080
    - service: reviews
      base_url: http://reviews:9080
    - service: ratings
      base_url: http://ratings:9080
    spec_files:
    - path: upstream/samples/bookinfo/swagger.yaml
      service: productpage
  infrastructure:
    enabled: true
    manifest_paths:
    - upstream/samples/bookinfo/platform/kube/bookinfo.yaml
    - upstream/samples/bookinfo/networking/bookinfo-gateway.yaml
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
