# ATG Phase 1 configuration for FTGO: the real deployment files under upstream/ (from
# opensource/fetch.py) and the stand-ins' traffic and traces. Generated by opensource/build.py from system.yaml. Edit system.yaml, not this file.
target:
  name: FTGO
  service_map:
    ftgo-api-gateway:8080: ftgo-api-gateway
    ftgo-consumer-service:8080: ftgo-consumer-service
    ftgo-order-service:8080: ftgo-order-service
    ftgo-order-history-service:8080: ftgo-order-history-service
    ftgo-kitchen-service:8080: ftgo-kitchen-service
    ftgo-restaurant-service:8080: ftgo-restaurant-service
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: ftgo-api-gateway
      base_url: http://ftgo-api-gateway:8080
    - service: ftgo-consumer-service
      base_url: http://ftgo-consumer-service:8080
    - service: ftgo-order-service
      base_url: http://ftgo-order-service:8080
    - service: ftgo-order-history-service
      base_url: http://ftgo-order-history-service:8080
    - service: ftgo-kitchen-service
      base_url: http://ftgo-kitchen-service:8080
    - service: ftgo-restaurant-service
      base_url: http://ftgo-restaurant-service:8080
    spec_files:
    - path: upstream/ftgo-consumer-service-api-spec/src/main/resources/ftgo-consumer-service-swagger.json
      service: ftgo-consumer-service
    - path: upstream/ftgo-restaurant-service-api-spec/src/main/resources/ftgo-restaurant-service-api-spec/web/ftgo-restaurant-service-swagger.json
      service: ftgo-restaurant-service
  infrastructure:
    enabled: true
    manifest_paths:
    - upstream/ftgo-api-gateway/src/deployment/kubernetes
    - upstream/ftgo-order-service/src/deployment/kubernetes
    - upstream/ftgo-consumer-service/src/deployment/kubernetes
    - upstream/ftgo-kitchen-service/src/deployment/kubernetes
    - upstream/ftgo-restaurant-service/src/deployment/kubernetes
    - upstream/ftgo-order-history-service/src/deployment/kubernetes
    - upstream/deployment/kubernetes/stateful-services
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
