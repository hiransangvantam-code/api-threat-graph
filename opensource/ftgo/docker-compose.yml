      retries: 40
  ftgo-kitchen-service:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: ftgo-kitchen-service
      MESH_PROXY: http://atg-proxy:8081
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - ftgo-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  ftgo-restaurant-service:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: ftgo-restaurant-service
      MESH_PROXY: http://atg-proxy:8081
    volumes:
    - ./company.json:/company/company.json:ro
