# ATG Phase 1 configuration for DeathStarBench Hotel Reservation: the real deployment files under upstream/ (from
# opensource/fetch.py) and the stand-ins' traffic and traces. Generated by opensource/build.py from system.yaml. Edit system.yaml, not this file.
target:
  name: DeathStarBench Hotel Reservation
  service_map:
    frontend:5000: frontend
    search:8082: search
    geo:8083: geo
    rate:8084: rate
    profile:8081: profile
    recommendation:8085: recommendation
    user:8086: user
    reservation:8087: reservation
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: frontend
      base_url: http://frontend:5000
    - service: search
      base_url: http://search:8082
    - service: geo
      base_url: http://geo:8083
    - service: rate
      base_url: http://rate:8084
    - service: profile
      base_url: http://profile:8081
    - service: recommendation
      base_url: http://recommendation:8085
    - service: user
      base_url: http://user:8086
    - service: reservation
      base_url: http://reservation:8087
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths:
    - upstream/hotelReservation/kubernetes
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
