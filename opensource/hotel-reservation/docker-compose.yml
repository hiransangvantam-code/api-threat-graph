# DeathStarBench Hotel Reservation (Hotel booking): stand-in services for the open-source benchmark.
# Generated by opensource/build.py from system.yaml. Edit system.yaml, not this file.
# Real code: https://github.com/delimitrou/DeathStarBench. Same service names and ports;
# the containers run companies/runtime/python, not the system's own code.
name: oss-hotel-reservation
services:
  frontend:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: frontend
      MESH_PROXY: http://atg-proxy:8081
      OTEL_EXPORTER_OTLP_ENDPOINT: http://atg-collector:4318
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - hotel-reservation-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  search:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
