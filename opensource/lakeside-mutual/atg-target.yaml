# ATG Phase 1 configuration for Lakeside Mutual: the real deployment files under upstream/ (from
# opensource/fetch.py) and the stand-ins' traffic and traces. Generated by opensource/build.py from system.yaml. Edit system.yaml, not this file.
target:
  name: Lakeside Mutual
  service_map:
    customer-core:8110: customer-core
    customer-self-service-backend:8080: customer-self-service-backend
    customer-management-backend:8100: customer-management-backend
    policy-management-backend:8090: policy-management-backend
    spring-boot-admin:9000: spring-boot-admin
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: customer-core
      base_url: http://customer-core:8110
    - service: customer-self-service-backend
      base_url: http://customer-self-service-backend:8080
    - service: customer-management-backend
      base_url: http://customer-management-backend:8100
    - service: policy-management-backend
      base_url: http://policy-management-backend:8090
    - service: spring-boot-admin
      base_url: http://spring-boot-admin:9000
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths:
    - upstream/kubernetes
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
