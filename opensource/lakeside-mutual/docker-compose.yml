# Lakeside Mutual (Insurance): stand-in services for the open-source benchmark.
# Generated by opensource/build.py from system.yaml. Edit system.yaml, not this file.
# Real code: https://github.com/Microservice-API-Patterns/LakesideMutual. Same service names and ports;
# the containers run companies/runtime/python, not the system's own code.
name: oss-lakeside-mutual
services:
  keygen:
    image: atg-company-python:1.0
    build: ../../companies/runtime/python
    user: '0'
    networks:
    - lakeside-mutual-net
    command:
    - python
    - -c
    - import secrets,os; p='/keys/token-key'; os.path.exists(p) or open(p,'w').write(secrets.token_hex(32))
    volumes:
    - keys:/keys
    restart: 'no'
  customer-core:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: customer-core
      MESH_PROXY: http://atg-proxy:8081
      TOKEN_KEY_FILE: /keys/token-key
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    - keys:/keys:ro
    networks:
    - lakeside-mutual-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8110/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  customer-self-service-backend:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: customer-self-service-backend
      MESH_PROXY: http://atg-proxy:8081
      TOKEN_KEY_FILE: /keys/token-key
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    - keys:/keys:ro
    networks:
    - lakeside-mutual-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  customer-management-backend:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: customer-management-backend
      MESH_PROXY: http://atg-proxy:8081
      TOKEN_KEY_FILE: /keys/token-key
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    - keys:/keys:ro
    networks:
    - lakeside-mutual-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  policy-management-backend:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: policy-management-backend
      MESH_PROXY: http://atg-proxy:8081
      TOKEN_KEY_FILE: /keys/token-key
    volumes:
    - ./company.json:/company/company.json:ro
    - ./live-specs:/company/live-specs:ro
    - keys:/keys:ro
    networks:
    - lakeside-mutual-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  spring-boot-admin:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: spring-boot-admin
      MESH_PROXY: http://atg-proxy:8081
      TOKEN_KEY_FILE: /keys/token-key
    volumes:
    - ./company.json:/company/company.json:ro
    - keys:/keys:ro
    networks:
    - lakeside-mutual-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
    depends_on:
      keygen:
        condition: service_completed_successfully
  users:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    profiles:
    - users
    restart: 'no'
    networks:
    - lakeside-mutual-net
    volumes:
    - ./company.json:/company/company.json:ro
    command: python traffic.py --gateway http://atg-proxy:8080 --mesh-proxy http://atg-proxy:8081 --wait 120 --rounds 15
networks:
  lakeside-mutual-net:
    name: lakeside-mutual-net
volumes:
  keys: {}
