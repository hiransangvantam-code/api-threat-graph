# ATG Phase 1 configuration for Online Boutique: the real deployment files under upstream/ (from
# opensource/fetch.py) and the stand-ins' traffic and traces. Generated by opensource/build.py from system.yaml. Edit system.yaml, not this file.
target:
  name: Online Boutique
  service_map:
    frontend:8080: frontend
    cartservice:7070: cartservice
    productcatalogservice:3550: productcatalogservice
    currencyservice:7000: currencyservice
    recommendationservice:8080: recommendationservice
    shippingservice:50051: shippingservice
    paymentservice:50051: paymentservice
    emailservice:8080: emailservice
    checkoutservice:5050: checkoutservice
    adservice:9555: adservice
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: frontend
      base_url: http://frontend:8080
    - service: cartservice
      base_url: http://cartservice:7070
    - service: productcatalogservice
      base_url: http://productcatalogservice:3550
    - service: currencyservice
      base_url: http://currencyservice:7000
    - service: recommendationservice
      base_url: http://recommendationservice:8080
    - service: shippingservice
      base_url: http://shippingservice:50051
    - service: paymentservice
      base_url: http://paymentservice:50051
    - service: emailservice
      base_url: http://emailservice:8080
    - service: checkoutservice
      base_url: http://checkoutservice:5050
    - service: adservice
      base_url: http://adservice:9555
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths:
    - upstream/kubernetes-manifests
    - upstream/istio-manifests
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
