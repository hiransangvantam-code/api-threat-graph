# ATG Phase 1 configuration for Spring PetClinic Microservices: the real deployment files under upstream/ (from
# opensource/fetch.py) and the stand-ins' traffic and traces. Generated by opensource/build.py from system.yaml. Edit system.yaml, not this file.
target:
  name: Spring PetClinic Microservices
  service_map:
    api-gateway:8080: api-gateway
    customers-service:8081: customers-service
    visits-service:8082: visits-service
    vets-service:8083: vets-service
    genai-service:8084: genai-service
    admin-server:9090: admin-server
    config-server:8888: config-server
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: api-gateway
      base_url: http://api-gateway:8080
    - service: customers-service
      base_url: http://customers-service:8081
    - service: visits-service
      base_url: http://visits-service:8082
    - service: vets-service
      base_url: http://vets-service:8083
    - service: genai-service
      base_url: http://genai-service:8084
    - service: admin-server
      base_url: http://admin-server:9090
    - service: config-server
      base_url: http://config-server:8888
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths: []
    compose_files:
    - upstream/docker-compose.yml
    gateway_configs:
    - path: upstream/spring-petclinic-api-gateway/src/main/resources/application.yml
      type: spring-cloud-gateway
      service: api-gateway
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
