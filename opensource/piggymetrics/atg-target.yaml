# ATG Phase 1 configuration for PiggyMetrics: the real deployment files under upstream/ (from
# opensource/fetch.py) and the stand-ins' traffic and traces. Generated by opensource/build.py from system.yaml. Edit system.yaml, not this file.
target:
  name: PiggyMetrics
  service_map:
    gateway:4000: gateway
    auth-service:5000: auth-service
    account-service:6000: account-service
    statistics-service:7000: statistics-service
    notification-service:8000: notification-service
    monitoring:8080: monitoring
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: gateway
      base_url: http://gateway:4000
    - service: auth-service
      base_url: http://auth-service:5000
    - service: account-service
      base_url: http://account-service:6000
    - service: statistics-service
      base_url: http://statistics-service:7000
    - service: notification-service
      base_url: http://notification-service:8000
    - service: monitoring
      base_url: http://monitoring:8080
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths: []
    compose_files:
    - upstream/docker-compose.yml
    gateway_configs:
    - path: upstream/config/src/main/resources/shared/gateway.yml
      type: zuul
      service: gateway
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
