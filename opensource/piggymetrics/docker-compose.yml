# PiggyMetrics (Personal finance): stand-in services for the open-source benchmark.
# Generated by opensource/build.py from system.yaml. Edit system.yaml, not this file.
# Real code: https://github.com/sqshq/piggymetrics. Same service names and ports;
# the containers run companies/runtime/python, not the system's own code.
name: oss-piggymetrics
services:
  gateway:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: gateway
      MESH_PROXY: http://atg-proxy:8081
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - piggymetrics-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:4000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  auth-service:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: auth-service
      MESH_PROXY: http://atg-proxy:8081
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - piggymetrics-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  account-service:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: account-service
      MESH_PROXY: http://atg-proxy:8081
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - piggymetrics-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:6000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  statistics-service:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: statistics-service
      MESH_PROXY: http://atg-proxy:8081
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - piggymetrics-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:7000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  notification-service:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: notification-service
      MESH_PROXY: http://atg-proxy:8081
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - piggymetrics-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  monitoring:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: monitoring
      MESH_PROXY: http://atg-proxy:8081
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - piggymetrics-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  exchangerates-api:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    environment:
      COMPANY: /company/company.json
      SERVICE: exchangerates-api
    volumes:
    - ./company.json:/company/company.json:ro
    networks:
    - piggymetrics-net
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  users:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    profiles:
    - users
    restart: 'no'
    networks:
    - piggymetrics-net
    volumes:
    - ./company.json:/company/company.json:ro
    command: python traffic.py --gateway http://atg-proxy:8080 --mesh-proxy http://atg-proxy:8081 --wait 120 --rounds 15
networks:
  piggymetrics-net:
    name: piggymetrics-net
