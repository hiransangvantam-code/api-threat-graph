# ATG Phase 1 configuration for Stan's Robot Shop: the real deployment files under upstream/ (from
# opensource/fetch.py) and the stand-ins' traffic and traces. Generated by opensource/build.py from system.yaml. Edit system.yaml, not this file.
target:
  name: Stan's Robot Shop
  service_map:
    web:8080: web
    catalogue:8080: catalogue
    user:8080: user
    cart:8080: cart
    shipping:8080: shipping
    payment:8080: payment
    ratings:80: ratings
sources:
  runtime_traffic:
    enabled: true
    capture_files: []
  openapi:
    enabled: true
    live_targets:
    - service: web
      base_url: http://web:8080
    - service: catalogue
      base_url: http://catalogue:8080
    - service: user
      base_url: http://user:8080
    - service: cart
      base_url: http://cart:8080
    - service: shipping
      base_url: http://shipping:8080
    - service: payment
      base_url: http://payment:8080
    - service: ratings
      base_url: http://ratings:80
    spec_files: []
  infrastructure:
    enabled: true
    manifest_paths: []
    compose_files:
    - upstream/docker-compose.yaml
    gateway_configs:
    - path: upstream/web/default.conf.template
      type: nginx
      service: web
      env:
        CATALOGUE_HOST: catalogue
        USER_HOST: user
        CART_HOST: cart
        SHIPPING_HOST: shipping
        PAYMENT_HOST: payment
        RATINGS_HOST: ratings
  callchain:
    enabled: true
    trace_paths: []
output_dir: output/raw
report_path: output/report.html
