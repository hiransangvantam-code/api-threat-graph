      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:9000/health', timeout=2)
      interval: 2s
      timeout: 3s
      retries: 40
  users:
    build: ../../companies/runtime/python
    image: atg-company-python:1.0
    profiles:
    - users
    restart: 'no'
    networks:
    - robot-shop-net
    volumes:
    - ./company.json:/company/company.json:ro
    command: python traffic.py --gateway http://atg-proxy:8080 --mesh-proxy http://atg-proxy:8081 --wait 120 --rounds 15
networks:
  robot-shop-net:
    name: robot-shop-net
